<app-student-header></app-student-header>
<div class="banner-wrapper">

  <!-- TOP IMAGE SECTION -->
  <div class="banner-image">
    <img src="feature-1.jpg" alt="Students Banner">

    <!-- Play Button -->
    <div class="play-btn" (click)="openVideo()">
      ▶
    </div>
  </div>


  <!-- BOTTOM CONTENT SECTION -->
   
  <div class="banner-bottom">

    <div class="content-left">
      <h2>
        Trusted by the 15,000+ happy students and online users since 2000
      </h2>

      <div class="banner-buttons">
        <button class="btn student">Enroll as Student</button>
        <button class="btn tutor">Apply as Tutor</button>
      </div>
    </div>

    <div class="content-right">

      <div class="stats">
        <div class="stat-card">
          <h3>9.8/10</h3>
          <p>Course Approval Score</p>
        </div>

        <div class="stat-card">
          <h3>13k+</h3>
          <p>Satisfied Students Worldwide</p>
        </div>
      </div>

      <div class="testimonial">
        <img src="user-28 (1).jpg" alt="User">
        <p>
          “All courses are incredibly helpful for people to achieve their goals”
        </p>
      </div>

    </div>

  </div>


  <!-- VIDEO MODAL -->
  <div class="video-modal" *ngIf="showVideo">
    <div class="video-content">

      <span class="close-btn" (click)="closeVideo()">✖</span>

      <video #videoPlayer width="100%" controls autoplay>
        <source src="9th-demo vedio.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>

    </div>
  </div>

</div>
<app-stud-footer>  </app-stud-footer>
