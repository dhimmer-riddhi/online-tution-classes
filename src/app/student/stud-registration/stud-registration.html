<app-student-header>  </app-student-header>
<!-- Gradient Header Section -->
<section class="contact-header">
  <div class="contact-content">
    <h1>Get in Touch</h1>

    <div class="breadcrumb">
      <a routerLink="/student/stud-home">🏠 Home</a> >
      <span>Contact</span>
    </div>
  </div>
</section>

<!-- Contact Form Section -->
<section class="contact-form-section">
  <div class="contact-card">
<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

  <!-- 🔵 STEP 1 - Personal Details -->
  <div *ngIf="step === 1" class="form-step">

    <h2>Personal Details</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" formControlName="fullName" placeholder="Enter full name">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="Enter email">
    </div>

    <div class="form-group">
      <label>Mobile Number</label>
      <input type="text" formControlName="mobile" placeholder="Enter mobile number">
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" formControlName="dob">
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select formControlName="gender">
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>City</label>
      <input type="text" formControlName="city">
    </div>

    <div class="form-group">
      <label>State</label>
      <input type="text" formControlName="state">
    </div>


    <button type="button" (click)="nextStep()" class="btn-next">Next</button>

  </div>


  <!-- 🔵 STEP 2 - Educational Details -->
  <div *ngIf="step === 2" class="form-step">

    <h2>Educational Details</h2>

    <div class="form-group">
      <label>Standard</label>
      <select formControlName="standard">
        <option value="">Select Standard</option>
        <option>9th</option>
        <option>10th</option>
        <option>11th</option>
        <option>12th</option>
      </select>
    </div>

    <div class="form-group">
      <label>Board</label>
      <select formControlName="board">
        <option value="">Select Board</option>
        <option>GSEB</option>
        <option>CBSE</option>
        <option>ICSE</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Stream</label>
      <select formControlName="stream">
        <option value="">Select Stream</option>
        <option>Science</option>
        <option>Commerce</option>
        <option>Arts</option>
      </select>
    </div>

    <!-- Science Group Only -->
    <div class="form-group" *ngIf="registerForm.get('stream')?.value === 'Science'">
      <label>Science Group</label>
      <select formControlName="scienceGroup">
        <option value="">Select Group</option>
        <option>PCM</option>
        <option>PCB</option>
        <option>PCMB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Subjects Interested</label>
      <input type="text" formControlName="subjects">
    </div>

    <button type="button" (click)="previousStep()" class="btn-back">Back</button>
    <button type="submit" class="btn-submit">Submit</button>

  </div>

</form>
    <img src="contact form img.png" alt="Image Not Found">
  </div>
</section>
