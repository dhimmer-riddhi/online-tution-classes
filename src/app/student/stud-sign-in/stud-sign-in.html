
<app-student-header>  </app-student-header>
<!-- ===== Gradient Header Section ===== -->
<section class="contact-header">
  <div class="contact-content">
    <h1>Sign into your account</h1>

    <div class="breadcrumb">
      <a routerLink="/student/stud-home">Home</a>
        <!-- <span class="home-icon">⌂</span> Home
      </a> -->
      <span class="separator"> &gt; </span>
      <span class="active">Sign In</span>
    </div>
  </div>
</section>

<!-- ===== Sign In Section ===== -->
<section class="contact-form-section">
  <div class="contact-card">
    <form 
      [formGroup]="loginForm" 
      (ngSubmit)="onLogin()" 
      class="form-step"
    >

      <h2>Sign In</h2>

      <div class="form-group">
        <label>Email Address</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="Enter your email"
        >
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          formControlName="password" 
          placeholder="Enter your password"
        >
      </div>
        
      <button type="submit" class="btn-submit">
        Sign In
      </button>

    </form>
     <img src="contact form img.png" alt="Image Not Found">
  </div>


  
</section>
<!-- Toast -->
<div class="custom-toast-container">

  <div #toastRef class="toast custom-toast" role="alert">

    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>

      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast">
      </button>
    </div>

  </div>

</div>
<app-stud-footer>  </app-stud-footer>
