<!-- Gradient Header Section -->
<section class="contact-header">
  <div class="contact-content">
    <h1>Teacher Registration</h1>

    <div class="breadcrumb">
      <a routerLink="/teacher/teacher-portal">🏠 Home</a> >
      <span>Register</span>
    </div>
  </div>
</section>

<!-- Registration Form Section -->
<section class="contact-form-section">
  <div class="contact-card">

    <form [formGroup]="registerForm" (ngSubmit)="registerTeacher()">

      <!-- 🔵 STEP 1 - Personal Details -->
      @if (step === 1) {
      <div class="form-step">

        <h2>Personal Details</h2>

        <div class="form-group">
          <label>Teacher Name</label>
          <input type="text" formControlName="teacherName">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" formControlName="mobile">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <button type="button" (click)="nextStep()" class="btn-next">
          Next
        </button>

      </div>
      }

      <!-- 🔵 STEP 2 - Professional Details -->
      @if (step === 2) {
      <div class="form-step">

        <h2>Professional Details</h2>

        <div class="form-group">
          <label>Teacher ID</label>
          <input type="number" formControlName="teacherId">
        </div>

        <div class="form-group">
          <label>Subject Expertise</label>
          <input type="text" formControlName="subjects">
        </div>

        <div class="form-group">
          <label>Experience (Years)</label>
          <input type="number" formControlName="experience">
        </div>

        <!-- ❌ Password removed (Admin will generate automatically) -->

        <button type="button" (click)="previousStep()" class="btn-back">
          Back
        </button>

        <button type="submit" class="btn-submit">
          Register ✅
        </button>

      </div>
      }

    </form>

  </div>
</section>
