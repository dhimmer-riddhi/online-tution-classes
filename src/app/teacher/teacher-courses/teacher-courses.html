<div class="main-layout">
  <div class="content-area">

    <form [formGroup]="courseForm" (ngSubmit)="submit()">
      <h2 class="form-title">Add New Course</h2>

      <div class="form-section">
        <label>Select Class</label>
        <select formControlName="class" (change)="onClassChange()">
          <option value="">Choose Standard</option>
          <option value="9th">9th Standard</option>
          <option value="10th">10th Standard</option>
          <option value="11th">11th Standard</option>
          <option value="12th">12th Standard</option>
        </select>
        <div class="error-msg" *ngIf="courseForm.get('class')?.touched && courseForm.get('class')?.invalid">
          Class is required
        </div>
      </div>

      <div class="flex-row">

  <!-- Board -->
  <div class="flex-col" *ngIf="showBoard">
    <label>Board</label>
    <select formControlName="board">
      <option value="">Select Board</option>
      <option value="GSEB">GSEB</option>
      <option value="CBSE">CBSE</option>
    </select>
  </div>

  <!-- Stream -->
  <div class="flex-col" *ngIf="showStream">
    <label>Stream</label>
    <select formControlName="stream" (change)="onStreamChange()">
      <option value="">Select Stream</option>
      <option value="Commerce">Commerce</option>
      <option value="Science">Science</option>
    </select>
  </div>

  <!-- Science Group -->
  <div class="flex-col" *ngIf="showScienceGroup">
    <label>Science Group</label>
    <select formControlName="scienceGroup">
      <option value="">Select Group</option>
      <option value="PCM">PCM</option>
      <option value="PCB">PCB</option>
    </select>
  </div>

</div>

      <div class="form-section">
        <h3>Subject Details</h3>
        <input type="text" formControlName="title" placeholder="Subject Name">
        <input type="text" formControlName="description" placeholder="Subject Description">
        
        <div class="flex-row">
          <input type="number" formControlName="fees" placeholder="Subject Fees">
          <input type="text" formControlName="duration" placeholder="Duration (e.g. 6 Months)">
          <input type="text" formControlName="mode" placeholder="Online / Offline">
        </div>
      </div>

      <div class="form-section" formGroupName="teacher">
        <h3>Teacher Details</h3>
        <input type="text" formControlName="name" placeholder="Teacher Name">
        <input type="text" formControlName="details" placeholder="Teacher Qualification">
        <textarea formControlName="bio" placeholder="Brief Teacher Bio"></textarea>

        <label class="file-label">Upload Teacher Profile</label>
        <input type="file" accept="image/*" (change)="uploadTeacherImage($event)">

        <div class="image-preview" *ngIf="teacherImage">
          <img [src]="teacherImage" width="100" height="100">
          <p class="success-text">✓ Image Uploaded Successfully</p>
        </div>
      </div>

      <div class="form-section">
        <h3>Chapters List</h3>
        <div formArrayName="chapters">
          <div *ngFor="let chapter of chapters.controls; let i = index" class="chapter-row">
            <input [formControlName]="i" placeholder="Chapter Name">
            <button type="button" class="remove-btn" (click)="chapters.removeAt(i)">
              ✕
            </button>
          </div>
        </div>
        <button type="button" class="add-btn" (click)="addChapter()">
          + Add New Chapter
        </button>
      </div>

      <button type="submit" class="submit-btn" [disabled]="courseForm.invalid">
        Save Course
      </button>

    </form>
  </div>
</div>

<!-- Toast Container -->
<!-- ====== CUSTOM TOAST ====== -->
<div class="toast-container custom-toast-container position-fixed bottom-0 end-0 p-3">

  <div #toastRef class="toast custom-toast border-0" role="alert" aria-live="assertive" aria-atomic="true">

    <div class="d-flex">

      <div class="toast-body">
        {{ toastMessage }}
      </div>

      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>

    </div>

  </div>

</div>
