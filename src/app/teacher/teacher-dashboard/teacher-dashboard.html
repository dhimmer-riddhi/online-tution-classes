<div class="main-layout">
  

  <div class="dashboard-container">
    <app-teacher-header></app-teacher-header>
    
    <h1 class="dashboard-title">
      Welcome {{teacherName}} 👋
    </h1>

    <div class="dashboard-cards">
      <div class="card students">
        <h2>{{totalStudents}}</h2>
        <p>Total Students</p>
      </div>
      <div class="card classes">
        <h2>{{totalClasses}}</h2>
        <p>Total Classes</p>
      </div>
      <div class="card subjects">
        <h2>{{totalSubjects}}</h2>
        <p>Total Subjects</p>
      </div>
      <div class="card assignments">
        <h2>{{totalNotes}}</h2>
        <p>Total Notes</p>
      </div>
      <div class="card videos">
        <h2>{{totalVideos}}</h2>
        <p>Total Uploaded Videos</p>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <h3>Notes by Class</h3>
        <canvas id="noteChart"></canvas>
      </div>
      <div class="chart-box">
        <h3>Uploaded Videos by Subject</h3>
        <canvas id="videoChart"></canvas>
      </div>
    </div>
  </div>
</div>
