<section class="contact-header">
  <div class="contact-content">
    <h1>Teacher Login</h1>

    <div class="breadcrumb">
      <a routerLink="/teacher/teacher-portal">🏠 Home</a> >
      <span>Login</span>
    </div>
  </div>
</section>

<section class="contact-form-section">
  <div class="contact-card">

    <form [formGroup]="loginForm" (ngSubmit)="loginTeacher()">

      <div class="form-step">

        <h2>Login Details</h2>

        <div class="form-group">
          <label>Email</label>
          <input type="text" formControlName="teacherId">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password">
        </div>

        <button type="submit" class="btn-submit" routerLink="/teacher/teacher-dashboard">
          Login 🔐
        </button>

      </div>

    </form>

  </div>
</section>
