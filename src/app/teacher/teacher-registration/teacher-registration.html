<section class="contact-header">
  <div class="contact-content">
    <h1>Teacher Registration</h1>
    <div class="breadcrumb">
      <a routerLink="/teacher/teacher-portal">🏠 Home</a>
      <span class="active"> > Register</span>
    </div>
  </div>
</section>

<section class="contact-form-section">
  <div class="contact-card">
    <form [formGroup]="registerForm" (ngSubmit)="registerTeacher()">

      <div *ngIf="step === 1" class="form-step">
        <h2>Personal Details</h2>
        <div class="form-group"><label>Name</label><input type="text" formControlName="teacherName" placeholder="Full Name"></div>
        <div class="form-group"><label>Email</label><input type="email" formControlName="email" placeholder="Email Address"></div>
        <div class="form-group"><label>Mobile</label><input type="text" formControlName="mobile" placeholder="10 Digit Mobile"></div>
        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <button type="button" (click)="nextStep()" class="btn-next">Next</button>
      </div>

      <div *ngIf="step === 2" class="form-step">
        <h2>Professional Details</h2>
        <div class="form-group"><label>Subject</label><input type="text" formControlName="subjects" placeholder="Expertise"></div>
        <div class="form-group"><label>Experience</label><input type="number" formControlName="experience" placeholder="Years"></div>

        <div class="form-group">
          <label>Upload CV (PDF)</label>
          <div class="d-flex align-items-center gap-2">
            <input type="file" (change)="onCvSelected($event)" accept=".pdf" class="form-control">
            <button *ngIf="cvPreviewUrl" type="button" class="btn btn-outline-primary btn-sm" (click)="viewFile(cvPreviewUrl)">
              👁️ View CV
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Upload Photo</label>
          <div class="d-flex align-items-center gap-2">
            <input type="file" (change)="onPhotoSelected($event)" accept="image/*" class="form-control">
            <button *ngIf="photoPreviewUrl" type="button" class="btn btn-outline-primary btn-sm" (click)="viewFile(photoPreviewUrl)">
              👁️ View Photo
            </button>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="button" (click)="previousStep()" class="btn-back">Back</button>
          <button type="submit" class="btn-submit" [disabled]="isUploading">
            {{ isUploading ? 'Submitting...' : 'Register' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</section>

<div class="toast-container">
  <div #saveToast class="toast align-items-center border-0">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>
