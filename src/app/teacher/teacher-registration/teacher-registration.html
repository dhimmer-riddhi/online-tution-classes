<!-- Gradient Header Section -->
<section class="contact-header">
  <div class="contact-content">
    <h1>Teacher Registration</h1>

    <div class="breadcrumb">
      <a routerLink="/teacher/teacher-portal"> 
        🏠 Home 
      </a>
      <span class="separator"> &gt; </span>
      <span class="active">Register</span>
    </div>
  </div>
</section>

<!-- Registration Form Section -->
<section class="contact-form-section">
  <div class="contact-card">

    <form [formGroup]="registerForm" (ngSubmit)="registerTeacher()">

      <!-- STEP 1: Personal Details -->
      <div *ngIf="step === 1" class="form-step">
        <h2>Personal Details</h2>

        <div class="form-group">
          <label>Teacher Name</label>
          <input type="text" formControlName="teacherName" placeholder="Enter full name">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="Enter email">
        </div>

        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" formControlName="mobile" placeholder="Enter mobile number">
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" formControlName="dob">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select formControlName="gender">
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>City</label>
          <input type="text" formControlName="city" placeholder="Enter city">
        </div>

        <div class="form-group">
          <label>State</label>
          <input type="text" formControlName="state" placeholder="Enter state">
        </div>

        <button type="button" (click)="nextStep()" class="btn-next">Next</button>
      </div>

      <!-- STEP 2: Professional Details -->
      <div *ngIf="step === 2" class="form-step">
        <h2>Professional Details</h2>

        <div class="form-group">
          <label>Subject Expertise</label>
          <input type="text" formControlName="subjects" placeholder="Enter subjects">
        </div>

        <div class="form-group">
          <label>Experience (Years)</label>
          <input type="number" formControlName="experience" placeholder="Enter experience">
        </div>

        <div class="form-group">
          <label>Upload CV (PDF/DOC)</label>
          <input type="file" (change)="onCvSelected($event)" accept=".pdf,.doc,.docx">
        </div>

        <div class="form-group">
          <label>Upload Profile Photo</label>
          <input type="file" (change)="onPhotoSelected($event)" accept="image/*">
        </div>

        <button type="button" (click)="previousStep()" class="btn-back">Back</button>
        <button type="submit" class="btn-submit">Register ✅</button>
      </div>

    </form>

    <!-- Decorative image -->
    <img src="leaves.png" alt="Teacher Registration" class="form-image">

  </div>
</section>
