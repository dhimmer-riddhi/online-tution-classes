<div class="register-container">
  <div class="register-card">
    <h2>👩‍🏫 Teacher Registration</h2>

    <form (ngSubmit)="registerTeacher()">
      <div class="form-group">
        <label>Teacher Name</label>
        <input type="text" [(ngModel)]="teacher.teacherName" name="teacherName" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="teacher.email" name="email" required />
      </div>

      <div class="form-group">
        <label>Teacher ID</label>
        <input type="text" [(ngModel)]="teacher.teacherId" name="teacherId" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="teacher.password" name="password" required />
      </div>

      <button type="submit" class="btn-register">Register ✅</button>
    </form>

    <p class="login-link">
      Already Registered? <a routerLink="/teacher/teacher-login">Login Here</a> 🔐
    </p> 
  </div>
</div>
