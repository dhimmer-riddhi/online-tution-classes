<div class="admin-layout">

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="logo">
      <img src="header logo.png" alt="Bright Classes Logo">
    </div>

    <ul class="menu">
      <li routerLink="/teacher/dashboard" routerLinkActive="active">
        <i class="fas fa-chart-line"></i> Dashboard
      </li>

      <li routerLink="/teacher/students" routerLinkActive="active">
        <i class="fas fa-user-graduate"></i> Students
      </li>

      <li routerLink="/teacher/class-content" routerLinkActive="active">
        <i class="fas fa-chalkboard-teacher"></i> Class Content
      </li>

      <li routerLink="/teacher/courses" routerLinkActive="active">
        <i class="fas fa-book"></i> Courses
      </li>

      <li routerLink="/teacher/notes" routerLinkActive="active">
        <i class="fas fa-money-bill"></i> Notes
      </li>

      <li routerLink="/teacher/quiz" routerLinkActive="active">
        <i class="fas fa-chart-pie"></i> Quiz
      </li>

      </ul>

    <ul class="menu logout-section">
        <li class="logout-item" (click)="onLogout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </li>
    </ul>

  </div>

  <!-- Right Content -->
  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>
