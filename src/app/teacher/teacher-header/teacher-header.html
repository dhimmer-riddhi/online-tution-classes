<div class="header-container">

  <!-- SIDEBAR -->
  <div class="sidebar">

    <div class="logo">
      📚 Online Tuition
    </div>

    <!-- PROFILE (Always Visible) -->
   @if (teacherData) {
      <div class="sidebar-profile">
        <img
          [src]="teacherData.profileImage || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'"
          class="profile-img"
          alt="Teacher Profile"
        />
        <h4>{{ teacherData.name }}</h4>
        <p>{{ teacherData.email }}</p>
      </div>
    }

    <!-- NAVIGATION -->
    <nav class="nav-links">
      <a routerLink="/teacher/teacher-dashboard" routerLinkActive="active"> Dashboard</a>
      <a routerLink="/teacher/student" routerLinkActive="active">Students</a>
      <a routerLink="/teacher/teacher-classes" routerLinkActive="active"> Classes</a>
      <a routerLink="/teacher/teacher-class-content" routerLinkActive="active">Classs-Content</a>
      <a routerLink="/teacher/quize" routerLinkActive="active">Quiz</a>
      <a routerLink="reports" routerLinkActive="active">📊 Reports</a>
      <button class="logout-btn" (click)="logout()">🚪 Logout</button>
    </nav>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>
