<div class="teacher-layout">

  <!-- Sidebar -->
   <app-teacher-header></app-teacher-header>

  <!-- Right Content -->
  <div class="content">

    <h2>My Students</h2>

    <table>

      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Standard</th>
        <th>Subjects</th>
      </tr>

      <tr *ngFor="let student of students">

        <td>{{student.fullName}}</td>
        <td>{{student.email}}</td>
        <td>{{student.standard}}</td>

        <td>
          <span *ngFor="let sub of student.subjects">
            {{sub}}
          </span>
        </td>
        <td>

          <button class="approve" (click)="approveStudent(student)">
            Approve
          </button>

          <button class="reject" (click)="rejectStudent(student)">
            Reject
          </button>

        </td>

      </tr>

    </table>

  </div>

</div>
<div class="toast-container">
  <div #saveToast class="toast align-items-center border-0">
    <div class="d-flex">
      <div class="toast-body">
        {{ toastMessage }}
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>
