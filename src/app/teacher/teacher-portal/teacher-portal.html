<!-- Gradient Header -->
<section class="contact-header">
  <div class="contact-content">
    <h1>Bright Classes</h1>
    <p class="sub-title">Empowering Teachers to Teach Smarter </p>
  </div>
</section>

<!-- Portal Card Section -->
<section class="contact-form-section">

  <div class="contact-card portal-card">

    <!-- Hero Image -->
    <img src="teacher-portal-hero.png" alt="Teacher Portal Illustration" class="hero-image">

    <h2> Teacher Portal</h2>

    <p class="description">
      Welcome to the Teacher Dashboard Portal.  
      Please register if you are a new teacher or login to continue.
    </p>

    <div class="button-group">
      <button routerLink="/teacher/teacher-registration"
              class="btn-submit register-btn">
         Register
      </button>

      <button routerLink="/teacher/teacher-login"
              class="btn-next login-btn">
         Login
      </button>
    </div>

  </div>

</section>
