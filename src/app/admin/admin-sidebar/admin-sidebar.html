<div class="admin-layout">

  <div class="sidebar">
    <div class="logo">
      <img src="header logo.png" alt="Bright Classes Logo">
    </div>

    <ul class="menu">
      <li routerLink="/admin/admin-dashboard" routerLinkActive="active">
        <i class="fas fa-chart-line"></i> Dashboard
      </li>

      <li routerLink="/admin/manage-application" routerLinkActive="active">
        <i class="fas fa-user-graduate"></i> Application
      </li>

      <li routerLink="/admin/manage-teacher" routerLinkActive="active">
        <i class="fas fa-chalkboard-teacher"></i> Teacher 
      </li>

      <li routerLink="/admin/admin-subject" routerLinkActive="active">
        <i class="fas fa-book"></i> Subject 
      </li>

      <li routerLink="/admin/fees" routerLinkActive="active">
        <i class="fas fa-money-bill"></i> Fees
      </li>

      <li routerLink="/admin/reports" routerLinkActive="active">
        <i class="fas fa-chart-pie"></i> Reports
      </li>
      </ul>
      <ul class="menu logout-section">
        <li class="logout-item" (click)="onLogout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </li>
      </ul>
  </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>

</div>
